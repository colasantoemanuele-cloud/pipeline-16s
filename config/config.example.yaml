# =========================================================================== #
# Configurazione di esempio della pipeline 16S                                #
# =========================================================================== #
#
# Elenca tutti i parametri dello schema. È pensata per essere copiata e
# compilata: così com'è non parte, perché i parametri obbligatori sono lasciati
# da dichiarare.
#
# La pipeline non contiene valori scritti nel codice: quanto segue è il punto
# di controllo dell'intera esecuzione. Lo schema rifiuta le chiavi che non
# conosce, quindi un refuso ferma l'esecuzione invece di passare inosservato.
#
# [OBBLIGATORIO]  Parametri che descrivono il dataset: il formato dei metadati,
#                 le etichette dei campioni, il primer, il troncamento, il
#                 riferimento. Non hanno un valore predefinito. Qui sono
#                 commentati, con il valore che hanno per OSD-734 a titolo di
#                 esempio: vanno tolti dal commento e dichiarati tutti, e la
#                 pipeline elenca quelli che mancano (E-G15-10). Un parametro
#                 non pertinente si dichiara nullo (null) o con un elenco vuoto
#                 ([]): per esempio positive_values: [] in un dataset senza
#                 controlli positivi.
# [OSD-734]       Parametri con un predefinito tarato sul dataset di
#                 riferimento: una scelta di metodo fissata su un fatto di
#                 OSD-734. Su un altro dataset vanno riesaminati; il report
#                 elenca quelli presi per difetto senza essere dichiarati.
# [SOSTITUIRE]    Segnaposto senza significato.

# --------------------------------------------------------------------------- #
# io: percorsi di ingresso e uscita, e come si individuano i file di lettura  #
# --------------------------------------------------------------------------- #
io:
  # Obbligatori: i dati non risiedono nel repository.
  fastq_dir: /percorso/ai/dati/OSD-734/fastq          # [SOSTITUIRE]
  assay_table: /percorso/ai/dati/OSD-734/a_assay.txt  # [SOSTITUIRE]
  # Tabella campioni di studio: porta la colonna della classe del campione,
  # che nella tabella di assay non c'è. È condivisa fra più assay dello stesso
  # studio, quindi contiene anche righe che a questo assay non appartengono:
  # il join verso di essa resta ristretto alle righe dell'assay.
  # FACOLTATIVA: con null, classe e variabili dei campioni si leggono dalla
  # tabella di assay, che allora deve portarne le colonne.
  study_table: /percorso/ai/dati/OSD-734/s_OSD-734.txt  # [SOSTITUIRE]
  out_root: /percorso/agli/output/osd734              # [SOSTITUIRE]
  # FACOLTATIVO. Associa a ciascun campione la piastra di estrazione e la
  # corsa di sequenziamento, valorizzando decontam.batch_column ed
  # err.batch_column. Quando è null la pipeline procede in modalità a corsa
  # singola e senza lotto: è un ingresso in più, non un requisito. Senza
  # questo file le sue colonne vanno dichiarate nulle o vuote
  # (err.batch_column, decontam.batch_column, meta.batch_key_column,
  # meta.batch_module_column, out.batch_columns), altrimenti G15 si ferma.
  batch_table: /percorso/ai/dati/OSD-734/lotto.tsv   # [SOSTITUIRE] oppure null
  fastq_glob: "*.fastq.gz"
  # Espressione regolare che estrae dal nome di ogni file la chiave del
  # campione: la corrispondenza intera oppure, se l'espressione ha un gruppo
  # di cattura, il primo gruppo (per file nominati per campione o per corsa,
  # per esempio "^(CAMP[0-9]+)_"). La stessa chiave si ricava dal valore di
  # meta.accession_column; un gruppo che serve solo a raggruppare va scritto
  # senza cattura, (?:...).
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # accession_regex: "[ESD]RX[0-9]{4,}"

# --------------------------------------------------------------------------- #
# meta: lettura della tabella dei metadati e campi derivati dai nomi          #
# --------------------------------------------------------------------------- #
meta:
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # sample_id_column: "Sample Name"
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # accession_column: "Raw Data File"
  # Colonna del nome del campione nella tabella di studio, se ha un nome
  # diverso da quello della tabella di assay; null: lo stesso nome.
  study_sample_id_column: null
  derive_module: true
  # Prefisso della posizione da cui si deriva il modulo senza il file di
  # arricchimento: tre lettere e una cifra, come i moduli della stazione nei
  # nomi delle posizioni (LAB1, NOD2, JLP1).
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # module_regex: "^([A-Z]{3}[0-9])"
  # Colonna della tabella campioni di studio da cui si deriva il modulo. È la
  # posizione dichiarata, non il nome del campione: un campione d'aria può
  # chiamarsi come una superficie, e derivarlo dal nome lo attribuirebbe a un
  # modulo che non gli compete. Le posizioni che non sono superfici non
  # producono alcun modulo.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # module_column: "Factor Value[Sample Location]"
  # Posizioni che non sono superfici: i campioni che le riportano non
  # appartengono a un modulo e non vi vengono forzati, né dalla derivazione né
  # dal valore dichiarato nel file di arricchimento. Raggrupparli per modulo
  # mescolerebbe l'aria di un locale con le sue superfici. I valori vuoti e i
  # marcatori convenzionali di "non applicabile" sono già trattati come
  # posizione assente e non vanno elencati qui.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # non_surface_positions:
  #   - Air Sample
  #   - Unopened 3DMM Swab Tube
  # Colonna con cui il file facoltativo di arricchimento identifica il
  # campione. Deve contenere l'accession, come ogni altra chiave di join della
  # pipeline: il nome del campione si ripete fra repliche, e un file che
  # identifichi i campioni per nome aggancia la replica sbagliata senza che
  # nulla se ne accorga. Se il tuo file non ha questa colonna, la si ricava
  # dalla tabella di assay associando il nome del campione.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # batch_key_column: experiment_accession
  # Colonna del file facoltativo che dichiara il modulo. Quando c'è, il modulo
  # viene da lì con il suo nome originale; la derivazione da module_regex è il
  # ripiego per i dataset privi di quel file.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # batch_module_column: module

# --------------------------------------------------------------------------- #
# filter: filtraggio e troncamento delle letture grezze                       #
# --------------------------------------------------------------------------- #
filter:
  # La lettura piu' corta del dataset completo: letture di 137-151 basi.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # truncLen: 137
  truncLen_shortfall_warn: 10
  # Nessuna base tolta in testa: le letture non contengono il primer e
  # iniziano nella regione conservata a valle del 515F.
  trimLeft: 0                       # [OSD-734]
  maxEE: 2
  truncQ: 2
  maxN: 0
  rm_phix: true

# --------------------------------------------------------------------------- #
# err: apprendimento del modello di errore di sequenziamento                  #
# --------------------------------------------------------------------------- #
err:
  # Nota: in YAML l'esponente richiede il segno esplicito. Scritto "1e8" il
  # valore verrebbe letto come stringa, non come numero.
  # La funzione che stima i tassi d'errore dalle transizioni osservate: loess
  # (il loess standard di dada2) oppure loess_monotono, che impone tassi non
  # crescenti con la qualita': serve quando le qualita' sono raggruppate in
  # pochi valori (NovaSeq, NextSeq), e S1 lo segnala (E-S1-03).
  error_function: loess
  nbases: 1.0e+8
  max_consist: 10
  randomize: true
  # Colonna di io.batch_table con la corsa di sequenziamento: S3 stima un
  # modello d'errore per corsa. Con null, o senza io.batch_table, stima un solo
  # modello su tutti i campioni.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # batch_column: run_prefix

# --------------------------------------------------------------------------- #
# dada: inferenza delle varianti di sequenza                                  #
# --------------------------------------------------------------------------- #
dada:
  # Ammessi: true, false oppure "pseudo" (vocabolario di dada2).
  pool: pseudo
  omega_a: 1.0e-40

# --------------------------------------------------------------------------- #
# chimera: rimozione delle sequenze chimeriche                                #
# --------------------------------------------------------------------------- #
chimera:
  method: consensus                 # consensus | pooled | per-sample
  min_fold_parent_over_abundance: 2
  min_parent_abundance: 2
  min_sample_fraction: 0.9
  allow_one_off: false

# --------------------------------------------------------------------------- #
# asv: selezione delle sequenze varianti                                      #
# --------------------------------------------------------------------------- #
asv:
  len_tol: 0

# --------------------------------------------------------------------------- #
# tax: assegnazione tassonomica e riferimento impiegato                       #
# --------------------------------------------------------------------------- #
# Nome, versione e checksum del riferimento sono obbligatori: senza di essi un
# risultato non è riconducibile ai dati che l'hanno prodotto.
tax:
  ref_fasta: /percorso/ai/riferimenti/silva_nr99_v138_train_set.fa.gz  # [SOSTITUIRE]
  ref_md5: "00000000000000000000000000000000"  # [SOSTITUIRE] md5 reale del file
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # ref_name: SILVA
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # ref_version: "138"
  # Il classificatore bayesiano naive di dada2 (assignTaxonomy): il training
  # set di SILVA per IdTaxa non e' distribuito da alcuna fonte.
  classifier: naive_bayes
  # Bootstrap minimo per assegnare un rango: 50 e non 80, perche' le letture
  # coprono 137 delle circa 253 basi dell'amplicone V4, e su sequenze piu'
  # corte il bootstrap e' sistematicamente piu' basso a parita' di correttezza.
  min_boot: 50                      # [OSD-734]
  # Prova anche il complemento inverso di ogni variante.
  try_rc: true
  # Nessuna assegnazione di specie, per la stessa ragione di min_boot.
  assign_species: false             # [OSD-734]
  # Elenco dei taxa con un difetto noto del riferimento (rank,name,path,...):
  # S8 marca le assegnazioni che vi ricadono. Per SILVA 138 versione 2 e' il
  # file silva_138_v2_bad-taxa.csv degli autori. null se non ce n'e' uno.
  ref_bad_taxa: null

# --------------------------------------------------------------------------- #
# filt: filtraggio tassonomico successivo all'assegnazione                    #
# --------------------------------------------------------------------------- #
filt:
  remove_na_phylum: true
  exclude_taxa:
    - Chloroplast
    - Mitochondria
    - Eukaryota

# --------------------------------------------------------------------------- #
# phylo: costruzione dell'albero filogenetico                                 #
# --------------------------------------------------------------------------- #
phylo:
  # Disattivata per difetto. L'albero si costruisce sulle varianti che restano
  # dopo i filtri finali (S13) ed entra nell'oggetto finale (S14). Su letture
  # corte, di un solo tratto del gene, un albero costruito da zero e' debolmente
  # risolto: va attivato sapendo che le relazioni profonde non sono sostenute.
  enabled: false
  # Varianti finali oltre le quali la fase si ferma prima del calcolo (E-S9-01):
  # il costo della massima verosimiglianza cresce rapidamente con il loro numero.
  max_seqs: 5000
  # Allineatore multiplo: decipher (DECIPHER::AlignSeqs).
  aligner: decipher
  # Modello evolutivo della massima verosimiglianza (phangorn): GTR con
  # eterogeneita' gamma fra i siti (quattro categorie) e siti invarianti.
  model: "GTR+G+I"

# --------------------------------------------------------------------------- #
# ctrl: come si riconoscono controlli negativi, positivi e campioni           #
# --------------------------------------------------------------------------- #
# Tutte le etichette sono quelle usate in OSD-734. Le tre categorie devono
# restare disgiunte: un campione non può appartenere a due di esse.
ctrl:
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # column: "Characteristics[Material Type]"
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # blank_values:
  #   - blank control
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # positive_values:
  #   - Positive Control
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # biological_values:
  #   - Surface swab
  # Campioni trattati come controlli negativi qualunque sia il materiale
  # dichiarato, riconosciuti dal valore di una colonna della tabella campioni di
  # studio. Il materiale resta quello originale nei metadati. In OSD-734 i
  # tamponi mai aperti sono dichiarati "Surface swab" ma non hanno campionato
  # alcuna superficie: bassa biomassa, composizione da reagente. Elenco vuoto:
  # nessuna riclassificazione.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # blank_override_column: "Factor Value[Sample Location]"
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # blank_override_values:
  #   - Unopened 3DMM Swab Tube
  # Validazione della corsa dai controlli positivi (S11). Un controllo e'
  # conforme se la sua fedelta' e la sua profondita' non si discostano da
  # quelle degli altri controlli dello stesso livello di concentrazione.
  min_positives: 3              # controlli minimi per una curva o per un livello
  min_positive_pass_frac: 0.75  # frazione minima di controlli conformi
  positive_gate: false          # true: sotto la frazione si ferma (E-S11-03);
                                # false: si prosegue con un avviso (E-S11-04)

# --------------------------------------------------------------------------- #
# katharoseq: calibrazione sui controlli positivi                             #
# --------------------------------------------------------------------------- #
katharoseq:
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # target_taxon: Variovorax
  # Colonna con le cellule di ciascun controllo positivo: il livello di
  # diluizione. Si cerca nel file di arricchimento e poi nella tabella di
  # studio, ed entra nell'oggetto anche se out.batch_columns e
  # out.study_columns non la nominano. Senza controlli positivi e' nulla, e
  # nessuna curva viene adattata (E-S11-05).
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # cell_count_column: katharoseq_cell_count
  collapse_rank: Genus              # rango a cui si somma il taxon atteso
  # Fedelta' (frazione delle letture del controllo sul taxon atteso) in funzione
  # di x = log10(profondita'): f = x^h / (k' + x^h), con k' = x50^h.
  curve_model: allosteric_sigmoid
  target_sensitivity: 0.90          # fedelta' a cui si legge la profondita' minima
  min_r2: 0.80                      # bonta' minima: 1 - SS_res / SS_tot sulla fedelta'
  read_stage: nonchimeric           # letture dell'oggetto integrato (dopo S7)

# --------------------------------------------------------------------------- #
# decontam: rimozione dei contaminanti a partire dai controlli negativi       #
# --------------------------------------------------------------------------- #
decontam:
  # Per prevalenza nei controlli negativi: il metodo per frequenza richiede una
  # misura di concentrazione del DNA che i metadati non hanno. Vocabolario di
  # decontam::isContaminant.
  method: prevalence                # [OSD-734]
  # 0.5 e non 0.1: i campioni sono a bassa biomassa, la contaminazione da
  # reagente puo' essere una quota rilevante del segnale, e la soglia e'
  # orientata alla sensibilita'.
  threshold: 0.5                    # [OSD-734]
  # Negativi minimi perche' una piastra abbia un confronto proprio; con meno, i
  # suoi campioni si confrontano con i negativi di tutte le piastre.
  min_blanks: 5
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # batch_column: extraction_plate_num
  # Combinazione delle probabilita' delle piastre (batch.combine di decontam;
  # il predefinito di decontam 1.28.0 e' minimum).
  batch_combine: minimum
  # Modalita' della decontaminazione: aggregate (tutti i biologici contro tutti
  # i negativi) o batch (per piastra, combinata con batch_combine). Qui
  # aggregate: le piastre hanno pochi negativi, e il minimo di dieci probabilita'
  # stimate ciascuna su cosi' pochi negativi e' permissivo per costruzione. La
  # modalita' non dichiarata si calcola comunque, come diagnostica.
  mode: aggregate                   # [OSD-734]

# --------------------------------------------------------------------------- #
# prev: filtro di prevalenza sulle varianti                                   #
# --------------------------------------------------------------------------- #
prev:
  # 1% e non il 5% abituale: i campioni vengono da oltre cento posizioni
  # distinte della stazione, e una variante propria di poche posizioni e'
  # segnale, non rumore. Il denominatore sono i biologici tenuti da S13.
  min_fraction: 0.01                # [OSD-734]
  min_count: 2
  apply: true

# --------------------------------------------------------------------------- #
# qc: soglie che governano avvisi e arresti                                   #
# --------------------------------------------------------------------------- #
# warn_frac_chimeric non può superare stop_frac_chimeric: l'esecuzione si
# fermerebbe prima di emettere l'avviso.
qc:
  # Ripiego della profondita' minima, sulle letture GREZZE: non e' confrontabile
  # con la soglia derivata da S11, che si applica allo stadio katharoseq.read_stage.
  min_reads_raw: 1000
  # katharoseq_if_available: la soglia di S11 se la curva e' attendibile,
  # altrimenti min_reads_raw con E-S11-02; fixed: sempre min_reads_raw.
  min_reads_mode: katharoseq_if_available
  # Frazione massima delle letture dei campioni biologici che la decontaminazione,
  # nella modalita' dichiarata, puo' rimuovere: oltre, E-S12-02.
  max_frac_contaminant: 0.40
  # Letture minime di un campione nell'oggetto finale, dopo tutti i filtri di S13:
  # vale per campione, e sotto il campione esce dall'oggetto finale con il motivo.
  min_reads_final: 1000
  # Frazione minima delle letture trattenute dall'insieme dei campioni finali, dalle
  # letture senza chimere a quelle dell'oggetto finale: vale per l'insieme, non per
  # il singolo campione; sotto, la validazione di S14 fallisce (E-S14-01).
  min_frac_reads_retained: 0.40
  max_asv_count: 300000
  # Controlli sul risultato del filtro (S2). Si applicano ai campioni biologici
  # e ai controlli positivi; i controlli negativi ne sono esclusi, perche' un
  # bianco azzerato dal filtro e' un bianco pulito, non un difetto dei parametri.
  # Campioni azzerati ammessi (E-S2-01): con 0 ne basta uno per fermarsi.
  max_zeroed_samples: 0
  # Perdita media massima ammessa (E-S2-02): oltre il 30% di letture scartate,
  # in media per campione, i parametri del filtro vanno rivisti.
  max_frac_lost_filter: 0.30
  # Frazione massima di letture piu' corte di filter.truncLen, che il filtro
  # scarterebbe, sui campioni biologici e sui controlli positivi: oltre, G09
  # (sulle prime letture) e S1 (su tutte) fermano l'esecuzione. Poche letture
  # corte non la fermano.
  max_frac_short_reads: 0.05
  warn_frac_chimeric: 0.25
  stop_frac_chimeric: 0.50
  # Frazione minima di varianti con il phylum assegnato da S8 (E-S8-02).
  min_frac_phylum: 0.80
  # Letture ispezionate per file dai gate che leggono le sequenze. La
  # validazione iniziale deve costare minuti, non ore: nessun gate legge un
  # file intero, l'integrità completa è già garantita dai checksum.
  head_reads: 10000
  # Frazione di letture che iniziano col primer oltre la quale G10 lo
  # considera presente. Se il gate fallisce, la correzione è impostare
  # filter.trimLeft alla lunghezza del primer.
  max_primer_hit_frac: 0.05
  # Controllo positivo di G10: frazione minima di letture che devono
  # presentare il motivo conservato. Verifica che le letture contengano la
  # regione amplificata dichiarata, NON che il campione sia buono: su OSD-734
  # il motivo compare nei controlli negativi quanto nei biologici, fra il 79%
  # e il 95%, perché i bianchi amplificano contaminanti e i contaminanti sono
  # batteri con lo stesso 16S.
  # La soglia è valutata sulla mediana dei soli campioni da cui ci si attende
  # il segnale del bersaglio (biologici e controlli positivi) e non su
  # ciascun file: su OSD-734 sei campioni biologici legittimi stanno sotto la
  # soglia, uno al 5,8%, e una verifica file per file li farebbe fallire.
  min_motif_frac: 0.25                          # [OSD-734]
  # Primer di amplificazione atteso a inizio lettura, in codici IUPAC
  # (Y = C o T, M = A o C). Qui 515F. Dipende dalla coppia di primer dello
  # studio: con una regione amplificata diversa sarebbe un'altra sequenza.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # primer_sequence: GTGYCAGCMGCCGCGGTAA
  # Motivo conservato atteso subito a valle del primer, come espressione
  # regolare: il punto indica una base qualunque. Serve da controllo positivo,
  # perché cercare la sola assenza del primer non distinguerebbe un file
  # corretto da un file privo di segnale. Dipende anch'esso dalla regione.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # conserved_motif: "TAC[AG].AGG..GC.AGCGTT"

# --------------------------------------------------------------------------- #
# retry: nuovi tentativi sulle fasi fallite                                   #
# --------------------------------------------------------------------------- #
retry:
  enabled: true
  max_attempts: 2
  # Elenco chiuso dei codici di errore per cui è ammesso un nuovo tentativo
  # automatico. Non dipende dal dataset: si ritenta solo dove l'azione
  # correttiva non modifica alcuna assunzione dell'analisi, e questo criterio
  # vale su qualunque dataset.
  whitelist:
    - E-S2-03
    - E-S3-01
    - E-S4-02
    - E-S5-01

# --------------------------------------------------------------------------- #
# out: forma degli artefatti prodotti                                         #
# --------------------------------------------------------------------------- #
out:
  # Formato di ps_final.rds (S14), l'oggetto finale della pipeline.
  serialization: rds
  # Varianti sulle righe, campioni sulle colonne. S10 lo verifica sugli
  # identificativi, non sulle dimensioni.
  taxa_are_rows: true
  # Identificativi ASV1, ASV2, ... per abbondanza decrescente nei campioni
  # biologici; a parita', abbondanza in tutti i campioni, poi la sequenza.
  # Assegnati in S10, mai rinumerati: dopo i filtri la numerazione ha dei vuoti.
  asv_id_scheme: abundance_rank
  # Identificativi dei campioni nell'oggetto integrato.
  sample_id_source: accession
  # Colonne dei metadati portate nell'oggetto integrato oltre a quelle
  # dell'inventario (accession, sample_name, classe, materiale, posizione,
  # modulo, piastra, corsa), con il nome originale. Nell'oggetto prendono un
  # nome sintattico; la corrispondenza e' in 10_phyloseq/colonne_metadati.tsv.
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # study_columns:
  #   - "Factor Value[Spaceflight]"
  #   - "Parameter Value[Sample Preservation Method]"
  # [OBBLIGATORIO] Da dichiarare. Esempio, il valore di OSD-734:
  # batch_columns:
  #   - extraction_plate_id
  #   - well_id
  #   - extraction_date
  #   - primer_plate
  #   - run_date
  #   - katharoseq_cell_count
  # Export piatti dell'oggetto finale in 12_final/ (S14): conteggi.tsv,
  # tassonomia.tsv, metadati.tsv, sequenze.fasta, indipendenti dalle
  # impostazioni locali e sufficienti a ricostruire l'oggetto.
  export_flat: true

# --------------------------------------------------------------------------- #
# run: ambiente di esecuzione, parallelismo, riproducibilità                  #
# --------------------------------------------------------------------------- #
run:
  # FACOLTATIVO: l'immagine con cui si dichiara di eseguire, registrata nella
  # provenienza di ogni fase. Va indicata per digest e non per tag: un tag può
  # essere riassegnato a un'immagine diversa, un digest no. Per un'immagine
  # pubblicata in un registro:
  #   docker image inspect <immagine> --format '{{index .RepoDigests 0}}'
  # per un'immagine solo locale, che non ha un digest di registro:
  #   echo "amplicon16s@$(docker image inspect <immagine> --format '{{.Id}}')"
  container: null
  # File di blocco delle versioni dei pacchetti R, relativo alla radice del
  # repository. E' gia' usato dal Dockerfile e dagli script R; dichiararlo qui
  # lo fa entrare nella configurazione risolta e nel suo digest, cosi' due
  # esecuzioni sono confrontabili anche rispetto alle versioni R impiegate.
  lockfile: renv.lock
  seed: 100
  # Per difetto i processori utilizzabili dal processo; indicare un numero
  # solo per usarne meno. Non incide sui risultati.
  # threads: 8
  batch_size: 24
  # Se conservare le letture filtrate da S2 (03_filtered) a esecuzione
  # conclusa. Le consumano S3 e S4, quindi non si rimuovono mai prima: con
  # false spariscono solo quando tutte le fasi sono concluse, e la rimozione
  # viene registrata accanto al manifesto di S2, cosi' una ripresa non la
  # scambia per un artefatto perso e non rifa' nulla. Se una fase che le legge
  # deve poi essere ripetuta, S2 viene rieseguita prima di lei.
  keep_filtered_fastq: true
  # La regola rigorosa sulla provenienza, da attivare nelle configurazioni
  # congelate. Con true l'esecuzione parte solo se il codice sta in un
  # repository git leggibile e senza modifiche non committate (src/ e R/), e se
  # i pacchetti R installati corrispondono a run.lockfile; l'impronta del
  # sorgente, quella del file di blocco e l'immagine dichiarata entrano
  # nell'impronta di ogni fase, quindi cambiare codice o ambiente rifa' le
  # fasi. L'immagine in run.container resta una dichiarazione: dall'interno del
  # container il suo digest non e' verificabile.
  strict_provenance: false

# =========================================================================== #
# Analisi ecologiche a valle                                                  #
# =========================================================================== #
# I gruppi sono riservati fin d'ora, ma le analisi non sono ancora realizzate e
# nessun parametro è stato definito. Restano mappe vuote: essendo lo schema a
# chiave chiusa, qualunque parametro vi venga scritto oggi verrebbe respinto,
# ed è il comportamento corretto finché non esiste codice che sappia
# interpretarlo.

norm: {}    # normalizzazione delle abbondanze
glom: {}    # aggregazione a un livello tassonomico
beta: {}    # misure di diversità beta
ord: {}     # ordinamento e riduzione dimensionale
stat: {}    # test statistici
