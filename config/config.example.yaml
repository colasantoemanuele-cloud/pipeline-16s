# =========================================================================== #
# Modello di configurazione della pipeline 16S                                #
# =========================================================================== #
#
# Elenca tutti i parametri dello schema. Va copiato e compilato: cosi' com'e'
# non parte, perche' i parametri obbligatori sono lasciati da dichiarare. Lo
# schema rifiuta le chiavi che non conosce: un refuso ferma l'esecuzione invece
# di passare inosservato.
#
# Nessun valore di questo file viene da un dataset. Ogni parametro e' di una di
# queste specie, indicata accanto:
#
# [OBBLIGATORIO]  Dipende dai dati o dallo studio: non ha un valore
#                 predefinito. La riga e' commentata e senza valore: va tolta
#                 dal commento e dichiarata, seguendo l'indicazione che la
#                 precede. La pipeline elenca quelli che mancano (E-G15-10).
#                 Dove e' indicato "oppure null" o "oppure []", un parametro
#                 non pertinente si dichiara nullo o vuoto.
# [PERCORSO]      Un file o una cartella di questa esecuzione: da sostituire.
# [STANDARD]      Il valore predefinito e' quello del pacchetto che realizza il
#                 calcolo, o una raccomandazione dei suoi autori; la fonte e'
#                 indicata. Si puo' omettere; va cambiato solo con una ragione.
# [UNICA FORMA]   La pipeline realizza un solo valore: si puo' omettere.
# [STRUMENTO]     Governa come si esegue o in che forma si scrive, non che cosa
#                 si conclude dai dati: si puo' omettere.
#
# Il report di ogni esecuzione dice, per ciascun parametro, se il valore e'
# stato dichiarato o preso dal predefinito.

# --------------------------------------------------------------------------- #
# io: percorsi di ingresso e uscita, e come si individuano i file di lettura  #
# --------------------------------------------------------------------------- #
io:
  fastq_dir: /percorso/alle/letture                   # [PERCORSO]
  assay_table: /percorso/alla/tabella_di_assay.txt    # [PERCORSO]
  # Tabella campioni di studio: porta la colonna della classe del campione
  # quando la tabella di assay non l'ha. Puo' essere condivisa fra piu' assay
  # dello stesso studio: il join resta ristretto alle righe di questo assay.
  # Con null, classe e variabili dei campioni si leggono dalla tabella di
  # assay, che allora deve portarne le colonne.
  study_table: /percorso/alla/tabella_di_studio.txt   # [PERCORSO] oppure null
  out_root: /percorso/alla/cartella_di_uscita         # [PERCORSO]
  # File del lotto: associa a ogni campione la piastra di estrazione e la corsa
  # di sequenziamento. Con null la pipeline procede a corsa singola e senza
  # lotto, e le colonne che vi si riferiscono si dichiarano nulle o vuote
  # (err.batch_column, decontam.batch_column, meta.batch_key_column,
  # meta.batch_module_column, out.batch_columns).
  batch_table: /percorso/al/file_del_lotto.tsv        # [PERCORSO] oppure null
  # Modello dei nomi dei file delle letture dentro fastq_dir, senza
  # sottocartelle. Si sceglie guardando la cartella: l'estensione dei file
  # (compressi o no) e, se la cartella contiene anche altro, la parte del nome
  # che distingue le letture da usare.
  # fastq_glob:                                       # [OBBLIGATORIO]
  # Espressione regolare che estrae dal nome di ogni file la chiave del
  # campione: la corrispondenza intera oppure, se l'espressione ha un gruppo di
  # cattura, il primo gruppo. La stessa chiave deve ricavarsi dal valore di
  # meta.accession_column. Si sceglie la parte del nome che e' unica per
  # campione (un accession, un codice): una che si ripete fra repliche
  # aggancerebbe la replica sbagliata.
  # accession_regex:                                  # [OBBLIGATORIO]

# --------------------------------------------------------------------------- #
# meta: lettura della tabella dei metadati e campi derivati dai nomi          #
# --------------------------------------------------------------------------- #
meta:
  # Colonna della tabella di assay con il nome del campione.
  # sample_id_column:                                 # [OBBLIGATORIO]
  # Colonna della tabella di assay da cui si ricava la chiave del campione con
  # io.accession_regex (di solito quella che riporta il file delle letture).
  # accession_column:                                 # [OBBLIGATORIO]
  # Colonna del nome del campione nella tabella di studio, se si chiama
  # diversamente da quella della tabella di assay; null: lo stesso nome.
  study_sample_id_column: null
  # Se derivare il modulo (il gruppo di posizioni a cui il campione appartiene)
  # dalla posizione dichiarata, con module_regex, quando il file del lotto non
  # lo dichiara. true se le posizioni hanno un prefisso che identifica il
  # gruppo; false se non c'e' un raggruppamento da derivare.
  # derive_module:                                    # [OBBLIGATORIO]
  # Espressione regolare, con un gruppo di cattura, che estrae il modulo dalla
  # posizione. Si scrive guardando i valori di module_column.
  # module_regex:                                     # [OBBLIGATORIO] oppure null
  # Colonna della tabella di studio con la posizione di prelievo. E' la
  # posizione dichiarata, non il nome del campione.
  # module_column:                                    # [OBBLIGATORIO] oppure null
  # Valori di module_column che non sono superfici (aria, materiale non usato):
  # i campioni che li riportano non appartengono a un modulo. I valori vuoti e
  # i marcatori di "non applicabile" sono gia' trattati come posizione assente.
  # non_surface_positions:                            # [OBBLIGATORIO] oppure []
  # Colonna con cui il file del lotto identifica il campione. Deve contenere
  # la stessa chiave estratta da io.accession_regex, non il nome del campione,
  # che si ripete fra repliche.
  # batch_key_column:                                 # [OBBLIGATORIO] oppure null
  # Colonna del file del lotto che dichiara il modulo; ha la precedenza sulla
  # derivazione da module_regex.
  # batch_module_column:                              # [OBBLIGATORIO] oppure null

# --------------------------------------------------------------------------- #
# filter: filtraggio e troncamento delle letture grezze                       #
# --------------------------------------------------------------------------- #
filter:
  # Lunghezza a cui si troncano le letture; quelle piu' corte sono scartate. Si
  # sceglie dal profilo delle lunghezze e della qualita' delle proprie letture:
  # non oltre la lunghezza che quasi tutte raggiungono, e prima che la qualita'
  # cali. S1 riporta la distribuzione e un troncamento suggerito per classe.
  # truncLen:                                         # [OBBLIGATORIO]
  # Di quante basi il troncamento puo' superare la lettura piu' corta osservata
  # prima che S1 lo segnali. Si sceglie in proporzione alla variabilita' delle
  # lunghezze che si considera normale per il proprio sequenziamento.
  # truncLen_shortfall_warn:                          # [OBBLIGATORIO]
  # Basi tolte in testa a ogni lettura. La lunghezza del primer se le letture
  # lo contengono ancora, zero se e' gia' stato rimosso: G10 lo verifica con
  # qc.primer_sequence.
  # trimLeft:                                         # [OBBLIGATORIO]
  maxEE: 2        # [STANDARD] tutorial di dada2, "standard filtering parameters"
  truncQ: 2       # [STANDARD] dada2::filterAndTrim
  maxN: 0         # [STANDARD] dada2::filterAndTrim
  rm_phix: true   # [STANDARD] dada2::filterAndTrim

# --------------------------------------------------------------------------- #
# err: apprendimento del modello di errore di sequenziamento                  #
# --------------------------------------------------------------------------- #
err:
  # La funzione che stima i tassi d'errore: loess (quella di dada2) oppure
  # loess_monotono, per le qualita' raggruppate in pochi valori, che S1 segnala
  # (E-S1-03).
  error_function: loess   # [STANDARD] dada2::learnErrors
  # In YAML l'esponente richiede il segno: "1e8" sarebbe letto come stringa.
  nbases: 1.0e+8          # [STANDARD] dada2::learnErrors
  max_consist: 10         # [STANDARD] dada2::learnErrors
  # Se scegliere a caso, invece che nell'ordine dei file, i campioni da cui si
  # stima il modello d'errore. true quando l'ordine dei file segue una
  # struttura dello studio (piastre, gruppi), cosi' che la stima non poggi sui
  # soli primi; il predefinito di dada2::learnErrors e' false.
  # randomize:                                        # [OBBLIGATORIO]
  # Colonna del file del lotto con la corsa di sequenziamento: S3 stima un
  # modello d'errore per corsa. Con null si stima un solo modello.
  # batch_column:                                     # [OBBLIGATORIO] oppure null

# --------------------------------------------------------------------------- #
# dada: inferenza delle varianti di sequenza                                  #
# --------------------------------------------------------------------------- #
dada:
  # Come i campioni condividono l'informazione nell'inferenza: false (ogni
  # campione da solo: il predefinito di dada2::dada), true (tutti insieme) o
  # "pseudo" (due passate). Insieme si recuperano le varianti rare presenti in
  # piu' campioni, al costo di piu' calcolo: dipende da quanto contano le
  # varianti rare nello studio.
  # pool:                                             # [OBBLIGATORIO]
  omega_a: 1.0e-40        # [STANDARD] dada2::setDadaOpt

# --------------------------------------------------------------------------- #
# chimera: rimozione delle sequenze chimeriche                                #
# --------------------------------------------------------------------------- #
chimera:
  method: consensus       # [STANDARD] dada2::removeBimeraDenovo
  # Quanto un genitore deve essere piu' abbondante di una variante perche'
  # questa possa essere giudicata chimerica. Il predefinito di dada2 dipende
  # dal metodo e dalla versione (vedi la documentazione di isBimeraDenovo e
  # isBimeraDenovoTable): va dichiarato il valore che si intende usare.
  # min_fold_parent_over_abundance:                   # [OBBLIGATORIO]
  min_parent_abundance: 2      # [STANDARD] dada2::isBimeraDenovoTable
  min_sample_fraction: 0.9     # [STANDARD] dada2::isBimeraDenovoTable
  allow_one_off: false         # [STANDARD] dada2::isBimeraDenovoTable

# --------------------------------------------------------------------------- #
# asv: selezione delle sequenze varianti                                      #
# --------------------------------------------------------------------------- #
asv:
  # Tolleranza sulla lunghezza delle varianti: le letture sono troncate tutte
  # alla stessa lunghezza, quindi ogni variante ha quella lunghezza.
  len_tol: 0              # [STRUMENTO]

# --------------------------------------------------------------------------- #
# tax: assegnazione tassonomica e riferimento impiegato                       #
# --------------------------------------------------------------------------- #
tax:
  # Il riferimento nel formato dei training set di dada2, e il suo MD5.
  ref_fasta: /percorso/al/riferimento.fa.gz           # [PERCORSO]
  ref_md5: "00000000000000000000000000000000"         # [PERCORSO] md5 reale del file
  # Nome e versione del riferimento, come vanno riportati con i risultati.
  # ref_name:                                         # [OBBLIGATORIO]
  # ref_version:                                      # [OBBLIGATORIO]
  classifier: naive_bayes   # [UNICA FORMA] dada2::assignTaxonomy
  # Bootstrap minimo per assegnare un rango. Su letture che coprono solo una
  # parte dell'amplicone il bootstrap e' piu' basso a parita' di correttezza.
  min_boot: 50              # [STANDARD] dada2::assignTaxonomy
  # Se provare anche il complemento inverso di ogni variante. true se le
  # letture possono essere nell'orientamento opposto a quello del riferimento
  # (dipende dal protocollo); il predefinito di dada2::assignTaxonomy e' false.
  # try_rc:                                           # [OBBLIGATORIO]
  assign_species: false     # [UNICA FORMA] la tassonomia arriva al genere
  # Elenco dei taxa con un difetto noto del riferimento (colonne name e rank):
  # S8 marca le assegnazioni che vi ricadono. null se non ce n'e' uno.
  ref_bad_taxa: null

# --------------------------------------------------------------------------- #
# filt: filtraggio tassonomico successivo all'assegnazione                    #
# --------------------------------------------------------------------------- #
filt:
  # Se togliere le varianti senza phylum assegnato. true se cio' che il
  # riferimento non riconosce nemmeno al phylum e' da considerare fuori
  # bersaglio; false se lo studio cerca anche organismi poco rappresentati nel
  # riferimento.
  # remove_na_phylum:                                 # [OBBLIGATORIO]
  # Nomi di taxa, a qualunque rango, le cui varianti si tolgono: cio' che il
  # gene amplificato cattura senza essere l'oggetto dello studio (per uno
  # studio sui batteri, di solito organelli ed eucarioti), scritti come li
  # scrive il riferimento.
  # exclude_taxa:                                     # [OBBLIGATORIO] oppure []

# --------------------------------------------------------------------------- #
# phylo: costruzione dell'albero filogenetico                                 #
# --------------------------------------------------------------------------- #
phylo:
  # Se costruire l'albero sulle varianti finali e aggiungerlo all'oggetto
  # finale. Serve alle distanze filogenetiche fra campioni; su letture corte,
  # di un solo tratto del gene, le relazioni profonde sono poco sostenute.
  # enabled:                                          # [OBBLIGATORIO]
  # Varianti finali oltre le quali la fase si ferma prima del calcolo
  # (E-S9-01): il costo cresce rapidamente con il loro numero. Si sceglie
  # secondo il tempo e la memoria disponibili.
  # max_seqs:                                         # [OBBLIGATORIO]
  aligner: decipher         # [UNICA FORMA] DECIPHER::AlignSeqs
  model: "GTR+G+I"          # [UNICA FORMA] massima verosimiglianza con phangorn

# --------------------------------------------------------------------------- #
# ctrl: come si riconoscono controlli negativi, positivi e campioni           #
# --------------------------------------------------------------------------- #
# Le tre categorie devono restare disgiunte.
ctrl:
  # Colonna (della tabella di studio, o di assay se quella manca) che dice di
  # che tipo e' il campione.
  # column:                                           # [OBBLIGATORIO]
  # I valori di quella colonna per i controlli negativi, per i controlli
  # positivi e per i campioni biologici. Si copiano dalla tabella; maiuscole e
  # spazi ai bordi non contano.
  # blank_values:                                     # [OBBLIGATORIO] oppure []
  # positive_values:                                  # [OBBLIGATORIO] oppure []
  # biological_values:                                # [OBBLIGATORIO]
  # Campioni da trattare come controlli negativi qualunque sia il tipo
  # dichiarato, riconosciuti dal valore di un'altra colonna (per esempio
  # materiale di campionamento mai usato). Il tipo dichiarato resta nei
  # metadati.
  # blank_override_column:                            # [OBBLIGATORIO] oppure null
  # blank_override_values:                            # [OBBLIGATORIO] oppure []
  # Controlli positivi minimi per adattare una curva di calibrazione e per
  # giudicare i controlli di un livello di diluizione. Dipende dal disegno:
  # quanti controlli ha ogni piastra e ogni livello. Sotto il minimo una
  # piastra non ha una curva propria (E-S11-02) e un livello non e' valutato
  # (E-S11-06).
  # min_positives:                                    # [OBBLIGATORIO]
  # Frazione minima di controlli positivi conformi al loro livello, e che cosa
  # fare sotto di essa: true ferma l'esecuzione (E-S11-03), false prosegue con
  # un avviso (E-S11-04).
  # min_positive_pass_frac:                           # [OBBLIGATORIO]
  # positive_gate:                                    # [OBBLIGATORIO]

# --------------------------------------------------------------------------- #
# katharoseq: calibrazione sui controlli positivi                             #
# --------------------------------------------------------------------------- #
katharoseq:
  # Il taxon atteso nei controlli positivi, come lo scrive il riferimento al
  # rango di collapse_rank.
  # target_taxon:                                     # [OBBLIGATORIO] oppure null
  # Colonna con le cellule di ciascun controllo positivo, cioe' il livello di
  # diluizione: nel file del lotto o nella tabella di studio.
  # cell_count_column:                                # [OBBLIGATORIO] oppure null
  # Rango a cui si sommano le varianti del taxon atteso: il piu' fine a cui il
  # riferimento lo distingue con le letture disponibili.
  # collapse_rank:                                    # [OBBLIGATORIO]
  curve_model: allosteric_sigmoid   # [UNICA FORMA]
  # Fedelta' (frazione delle letture del controllo sul taxon atteso) a cui si
  # legge sulla curva la profondita' minima dei campioni. Piu' alta, piu'
  # campioni esclusi: si sceglie secondo quanta contaminazione si accetta nei
  # campioni a bassa biomassa, e conviene verificarne la stabilita'.
  # target_sensitivity:                               # [OBBLIGATORIO]
  # Bonta' minima dell'adattamento (R^2 sulla fedelta') perche' una curva sia
  # valida.
  # min_r2:                                           # [OBBLIGATORIO]
  read_stage: nonchimeric           # [UNICA FORMA] letture senza chimere

# --------------------------------------------------------------------------- #
# decontam: rimozione dei contaminanti a partire dai controlli negativi       #
# --------------------------------------------------------------------------- #
decontam:
  method: prevalence        # [UNICA FORMA] prevalenza nei controlli negativi
  # Soglia della probabilita' sotto la quale una variante e' un contaminante.
  # Il predefinito di decontam::isContaminant e' 0.1; un valore piu' alto
  # toglie di piu' e si usa quando la contaminazione da reagente e' una quota
  # rilevante del segnale (bassa biomassa).
  # threshold:                                        # [OBBLIGATORIO]
  # Controlli negativi minimi perche' una piastra abbia un confronto proprio;
  # con meno, i suoi campioni si confrontano con i negativi di tutte.
  # min_blanks:                                       # [OBBLIGATORIO]
  # Colonna del file del lotto con la piastra di estrazione.
  # batch_column:                                     # [OBBLIGATORIO] oppure null
  batch_combine: minimum    # [STANDARD] decontam::isContaminant
  # aggregate (tutti i biologici contro tutti i negativi) o batch (per piastra,
  # con batch_combine). Per piastra serve un numero adeguato di negativi in
  # ogni piastra; l'altra modalita' si calcola comunque, come diagnostica.
  # mode:                                             # [OBBLIGATORIO]

# --------------------------------------------------------------------------- #
# prev: filtro di prevalenza sulle varianti                                   #
# --------------------------------------------------------------------------- #
prev:
  # Se applicare il filtro; la frazione minima di campioni biologici tenuti in
  # cui una variante deve comparire; e le letture minime perche' conti come
  # presente in un campione. Dipendono da quanto sono eterogenei i campioni: in
  # uno studio con molti ambienti diversi una variante di pochi campioni puo'
  # essere segnale.
  # apply:                                            # [OBBLIGATORIO]
  # min_fraction:                                     # [OBBLIGATORIO]
  # min_count:                                        # [OBBLIGATORIO]

# --------------------------------------------------------------------------- #
# qc: soglie che governano avvisi e arresti                                   #
# --------------------------------------------------------------------------- #
# Sono soglie di qualita': vanno fissate per il proprio dataset, guardando le
# misure che il report di una prima esecuzione riporta accanto a ciascuna.
qc:
  # Letture ispezionate per file dai gate di S0: abbastanza da rappresentare il
  # file, poche abbastanza da validare in minuti.
  # head_reads:                                       # [OBBLIGATORIO]
  # Primer di amplificazione, in codici IUPAC, e frazione di letture che
  # iniziano con il primer oltre la quale G10 lo considera presente.
  # primer_sequence:                                  # [OBBLIGATORIO]
  # max_primer_hit_frac:                              # [OBBLIGATORIO]
  # Motivo conservato atteso all'inizio della regione amplificata, come
  # espressione regolare, e frazione minima di letture che devono portarlo
  # (sulla mediana dei campioni biologici e dei controlli positivi). null: G10
  # verifica la sola assenza del primer.
  # conserved_motif:                                  # [OBBLIGATORIO] oppure null
  # min_motif_frac:                                   # [OBBLIGATORIO]
  # Frazione massima di letture piu' corte di filter.truncLen (G09, S1).
  # max_frac_short_reads:                             # [OBBLIGATORIO]
  # Campioni che il filtro puo' azzerare (E-S2-01) e perdita media massima di
  # letture nel filtro (E-S2-02), sui biologici e sui controlli positivi.
  # max_zeroed_samples:                               # [OBBLIGATORIO]
  # max_frac_lost_filter:                             # [OBBLIGATORIO]
  # Varianti distinte oltre le quali S5 si ferma (E-S5-01): secondo la memoria
  # disponibile.
  # max_asv_count:                                    # [OBBLIGATORIO]
  # Frazione di letture chimeriche che da' un avviso e quella che ferma S6; la
  # prima non puo' superare la seconda.
  # warn_frac_chimeric:                               # [OBBLIGATORIO]
  # stop_frac_chimeric:                               # [OBBLIGATORIO]
  # Frazione minima di varianti con il phylum assegnato (E-S8-02).
  # min_frac_phylum:                                  # [OBBLIGATORIO]
  # Da dove viene la profondita' minima dei campioni: katharoseq_if_available
  # (le soglie dei controlli positivi, S11) oppure none (nessuna soglia di
  # profondita'). Senza controlli positivi in diluizione: none.
  # min_reads_mode:                                   # [OBBLIGATORIO]
  # Frazione massima delle letture dei biologici che la decontaminazione puo'
  # rimuovere (E-S12-02).
  # max_frac_contaminant:                             # [OBBLIGATORIO]
  # Letture minime di un campione nell'oggetto finale (sotto, il campione
  # esce) e frazione minima di letture trattenute dall'insieme (E-S14-01).
  # min_reads_final:                                  # [OBBLIGATORIO]
  # min_frac_reads_retained:                          # [OBBLIGATORIO]

# --------------------------------------------------------------------------- #
# retry: nuovi tentativi sulle fasi fallite                                   #
# --------------------------------------------------------------------------- #
retry:
  enabled: true           # [STRUMENTO]
  max_attempts: 2         # [STRUMENTO]
  # Codici per cui e' ammesso un nuovo tentativo automatico: solo dove l'azione
  # correttiva non modifica alcuna assunzione dell'analisi.
  whitelist:              # [STRUMENTO]
    - E-S2-03
    - E-S4-02

# --------------------------------------------------------------------------- #
# out: forma degli artefatti prodotti                                         #
# --------------------------------------------------------------------------- #
out:
  serialization: rds              # [UNICA FORMA]
  taxa_are_rows: true             # [UNICA FORMA]
  asv_id_scheme: abundance_rank   # [UNICA FORMA]
  sample_id_source: accession     # [UNICA FORMA]
  # Colonne dei metadati da portare nell'oggetto oltre a quelle dell'inventario
  # (accession, sample_name, classe, materiale, posizione, modulo, piastra,
  # corsa), con il nome originale: dalla tabella di studio e dal file del
  # lotto. Sono le variabili che le analisi a valle useranno.
  # study_columns:                                    # [OBBLIGATORIO] oppure []
  # batch_columns:                                    # [OBBLIGATORIO] oppure []
  # Export in testo dell'oggetto finale (conteggi, tassonomia, metadati,
  # sequenze).
  export_flat: true               # [STRUMENTO]

# --------------------------------------------------------------------------- #
# run: ambiente di esecuzione, parallelismo, riproducibilita'                 #
# --------------------------------------------------------------------------- #
run:
  # L'immagine con cui si dichiara di eseguire, per digest; e' registrata nella
  # provenienza, non sceglie l'immagine. Per un'immagine di un registro:
  #   docker image inspect <immagine> --format '{{index .RepoDigests 0}}'
  container: null
  lockfile: renv.lock             # [STRUMENTO]
  seed: 100                       # [STRUMENTO] valore arbitrario, fisso
  # Processori da usare; senza, quelli utilizzabili dal processo.
  # threads: 8
  # Tempo massimo in secondi di ogni processo R; senza, nessun limite (E-R-05).
  # r_timeout_s: 86400
  batch_size: 24                  # [STRUMENTO]
  # Se conservare le letture filtrate a esecuzione conclusa.
  keep_filtered_fastq: true       # [STRUMENTO]
  # La regola rigorosa sulla provenienza: con true l'esecuzione parte solo da
  # un repository git senza modifiche non committate in src/ e R/, e in un
  # ambiente R che corrisponde a run.lockfile.
  strict_provenance: false        # [STRUMENTO]

# =========================================================================== #
# Analisi ecologiche a valle                                                  #
# =========================================================================== #
# Gruppi riservati, senza parametri: qualunque chiave vi venga scritta e'
# respinta.

norm: {}    # normalizzazione delle abbondanze
glom: {}    # aggregazione a un livello tassonomico
beta: {}    # misure di diversita' beta
ord: {}     # ordinamento e riduzione dimensionale
stat: {}    # test statistici
