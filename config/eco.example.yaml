# Modello di configurazione delle analisi ecologiche di base.
#
# Le analisi lavorano a valle della pipeline, sull'oggetto finale che essa
# consegna (ps_final.rds), e non lo modificano. Questo file e' un modello: non
# contiene valori. Copialo, togli il commento a ogni parametro [OBBLIGATORIO] e
# dagli il valore del tuo studio. Le configurazioni complete dei dataset
# distribuiti con il repository stanno accanto ai loro dati, sotto dati/.
#
# Il sottocomando "eco init" scrive un file come questo a partire dal proprio
# oggetto, con cio' che l'oggetto contiene e con le proposte gia' scritte
# (GUIDA.md, passo 10; RIFERIMENTO.md, sezione 4).
#
# Marcatori:
#   [OBBLIGATORIO]   nessun valore predefinito: senza, l'analisi non parte
#   [CONDIZIONALE]   obbligatorio se il metodo indicato e' richiesto, respinto
#                    altrimenti
#   [FACOLTATIVO]    il predefinito e' l'assenza
#   [STANDARD]       il predefinito e' quello del pacchetto R che realizza il
#                    metodo, indicato accanto
#
# Le chiavi sconosciute sono respinte. I nomi di colonna sono quelli della
# tabella dei campioni dell'oggetto; i valori si confrontano come testo.
#
# Divisioni dei metadati. Dove va una colonna (design.variable,
# design.other_variables, comp.group_by, ord.color_by, comp.facet_wrap, rows e
# cols di comp.facet_grid) si puo' scrivere il nome di una divisione del
# catalogo dello strumento (src/amplicon16s_eco/divisioni.yaml): «fase»,
# «volo o terra», «soggetto», «tipo di materiale», «tempo di raccolta»...
# oppure <colonna>_prefisso. Lo strumento ne ricava la regola sui
# metadati dell'oggetto; un incrocio («soggetto per fase») e' il valore di
# comp.facet_grid. eco init elenca le divisioni che funzionano sul dataset, e
# ne scrive i gruppi in <configurazione>_divisioni_proposte.tsv. Un nome si
# legge, nell'ordine: gruppo derivato dichiarato, colonna con valori,
# divisione, colonna vuota. Un nome sconosciuto in quei campi e' respinto con
# E-ECO-47; una divisione che sull'oggetto non da' da 2 a 12 gruppi, almeno due
# con stat.min_group_size campioni, per almeno meta' dei campioni, con E-ECO-48
# (RIFERIMENTO.md, sezione 4.7).

design:
  # [OBBLIGATORIO] La variabile biologica: una colonna della tabella dei
  # campioni, un gruppo derivato o una divisione dei metadati (per nome),
  # trattata come categorica.
  # variable:

  # [FACOLTATIVO] Altre variabili biologiche, analizzate una alla volta.
  # other_variables: []

  # [FACOLTATIVO] Variabili tecniche (per esempio il lotto di estrazione),
  # nell'ordine in cui entrano nei modelli.
  # technical_variables: []

  # [FACOLTATIVO] Sottoinsieme dei campioni: per ogni colonna i valori ammessi
  # (fra virgolette). Si applica prima di tutto il resto.
  # subset: {}

  # [FACOLTATIVO] Variabili continue: misure numeriche (una distanza, un tempo,
  # una concentrazione), con il punto decimale. Per ciascuna l'analisi calcola
  # la correlazione di Spearman con ogni indice di alfa diversita' e una
  # PERMANOVA con la variabile come termine numerico. Una colonna dichiarata
  # qui non si dichiara fra le variabili categoriche.
  # continuous_variables: []

  # [FACOLTATIVO] Colonna del soggetto in un disegno a misure ripetute (lo
  # stesso individuo, o lo stesso sito, campionato in piu' condizioni). Con il
  # soggetto ogni variabile categorica e' analizzata anche entro soggetto, sui
  # soggetti che hanno un campione in ogni livello: Wilcoxon dei ranghi con
  # segno (due livelli) o Friedman (piu' di due), e PERMANOVA con le
  # permutazioni entro il soggetto.
  # subject: null

  # [FACOLTATIVO] Gruppi derivati: nuove variabili categoriche ricavate da una
  # colonna, con un elenco di valori per gruppo (groups) oppure con
  # un'espressione regolare (pattern, PCRE) il cui primo gruppo di cattura da'
  # il nome del gruppo. Si usano come le colonne: in variable,
  # other_variables, ord.color_by, comp.group_by, comp.facet_wrap e
  # comp.facet_grid. I valori che non rientrano restano senza gruppo (NA) e il
  # campione esce dalle analisi di quella variabile, con il motivo in
  # campioni.tsv. eco validate stampa i gruppi ottenuti, con i campioni. Le
  # divisioni del catalogo non serve scriverle qui: si nominano; i gruppi
  # derivati sono per le divisioni personalizzate. Il nome non puo' essere
  # quello di una colonna con valori (una colonna vuota e' sostituita). Una regola
  # sbagliata o ambigua (entrambe le regole o nessuna, un valore in due gruppi,
  # un'espressione senza gruppo di cattura) e' respinta con E-ECO-40.
  # groupings: {}
  #   bagno_cucina:
  #     from: <colonna>
  #     groups:
  #       bagno: ["<valore>", "<valore>"]
  #       cucina: ["<valore>"]
  #   prefisso_della_posizione:
  #     from: <colonna>
  #     pattern: "^([A-Z]+[0-9]?)"

run:
  # [OBBLIGATORIO] Seme della rarefazione e di ogni altra operazione casuale.
  # seed:

  # [FACOLTATIVO] Livello dei calcoli. Nullo vuol dire le varianti, la pratica
  # comune. Con un rango, alfa diversita', distanze, ordinazioni, test e metodo
  # vincolato lavorano sui taxa agglomerati con phyloseq::tax_glom(taxrank =
  # <rango>, NArm = FALSE): le varianti senza nome al rango restano separate
  # secondo il loro lignaggio ai ranghi superiori, e UniFrac usa l'albero
  # potato da tax_glom. Si perde la risoluzione delle varianti; si guadagnano
  # meno taxa rari e meno zeri. Ogni tabella dichiara il livello nella sua
  # intestazione. E' distinto dal rango dei grafici (comp.rank).
  # analysis_rank: null

filter:
  # [FACOLTATIVO] Soglia di abbondanza relativa, in percentuale (0.1 = 0,1%);
  # nullo vuol dire nessun filtro. Si applica dopo design.subset e prima di ogni analisi
  # (alfa, composizione, distanze, ordinazioni, test). E' un'alternativa, o un
  # complemento, alla rarefazione: la letteratura non e' concorde (RAZIONALE.md,
  # sezione 4.2). Bokulich et al. 2013 (Nat Methods 10:57) propongono lo 0,005%
  # delle letture totali, pensato per le OTU; Cao et al. 2021 (Front
  # Microbiol 11:607325) e Nikodemova et al. 2023 (Front Cell Infect
  # Microbiol 13:1165295) misurano l'effetto del filtro: forte su ricchezza e Chao1,
  # piccolo su Shannon e Bray-Curtis. Le varianti tolte sono in
  # filtro/varianti_filtrate.tsv, le letture tolte per campione in campioni.tsv.
  # Un campione rimasto senza letture esce da tutte le analisi (avviso
  # E-ECO-37); se ne restano meno di due l'analisi non parte (E-ECO-38).
  # min_relative_abundance: null

  # [CONDIZIONALE: min_relative_abundance] Su che cosa si misura la soglia:
  #   sample  in ogni campione si azzerano le varianti sotto la soglia delle
  #           letture di quel campione
  #   total   si tolgono da tutti i campioni le varianti la cui somma e' sotto
  #           la soglia delle letture totali dei campioni analizzati (Bokulich 2013)
  #   mean    si tolgono le varianti la cui abbondanza relativa media fra i
  #           campioni e' sotto la soglia
  # scope:

alpha:
  # [OBBLIGATORIO] rarefy: alfa diversita' su conteggi rarefatti, senza
  # reinserimento; none: sui conteggi non rarefatti, dopo l'eventuale filtro,
  # con la correlazione fra letture e ogni indice in alfa/profondita.tsv (avviso
  # E-ECO-39 se un indice dipende dalla profondita'). McMurdie e Holmes 2014
  # sconsigliano la rarefazione per l'abbondanza differenziale; Schloss 2024 la
  # trova il modo piu' affidabile di controllare la profondita' per alfa e beta
  # diversita'. Gli indici: ricchezza osservata, Shannon, Gini-Simpson, Chao1
  # (senza singleton Chao1 coincide con la ricchezza: avviso E-ECO-36).
  # method:

  # [CONDIZIONALE: rarefy] [STANDARD null] Profondita' di rarefazione; nulla
  # vuol dire la minima fra i campioni analizzati (phyloseq::rarefy_even_depth, sample.size =
  # min(sample_sums(physeq))). Se dichiarata, i campioni con meno letture
  # escono dall'alfa diversita'.
  # rarefy_depth: null

  # [CONDIZIONALE: rarefy] [STANDARD 1] Numero di rarefazioni: con piu' di una,
  # ogni indice e' la media sulle ripetizioni (rarefazione ripetuta, Schloss
  # 2024), e alfa/alfa_per_rarefazione.tsv riporta gli indici di ognuna. Tutte
  # vengono dallo stesso seme.
  # rarefy_iterations: 1

comp:
  # [OBBLIGATORIO] Rango tassonomico dei grafici e delle tabelle della
  # composizione, fra quelli dell'oggetto (eco init li elenca con la quota di
  # varianti assegnate): qualunque rango, anche meno specifico del proposto.
  # Oppure un elenco di ranghi, [<rango>, <rango>]: ogni rango ha
  # allora la sua sottocartella composizione/<rango>/; con un rango solo i file
  # stanno in composizione/. Se e' dichiarato run.analysis_rank, nessun rango
  # puo' essere piu' fine di quello.
  # rank:

  # [OBBLIGATORIO] Numero di taxa mostrati nei grafici; i rimanenti in «altri».
  # top_n:

  # [FACOLTATIVO] Colonne o gruppi derivati per cui disegnare le barre della
  # composizione (abbondanza relativa media per gruppo, dopo phyloseq::tax_glom
  # al rango, con i non assegnati in una voce propria). Vuoto: le variabili del
  # disegno. Cosi' si ha la composizione per un'altra colonna, o per un gruppo
  # derivato, senza cambiare la variabile dei test.
  # group_by: []

  # [FACOLTATIVO] Colonna o gruppo derivato: barre per campione, un pannello
  # per gruppo (ggplot2::facet_wrap, scale libere sull'asse x), con gli stessi
  # taxa, la stessa voce «altri» e la palette di plot.palette. Accanto al
  # grafico composizione/pannelli_<colonna>.tsv con i valori disegnati. Nel
  # pannello i campioni sono in ordine decrescente del taxon piu' abbondante
  # nel complesso. Un campione senza abbondanze al rango non e' disegnato: lo
  # dice una nota.
  # facet_wrap: null

  # [FACOLTATIVO] Barre medie per gruppo della variabile del disegno
  # (design.variable) in una griglia di pannelli: righe e colonne sono due
  # colonne, gruppi derivati o divisioni (ggplot2::facet_grid), oppure il nome
  # di un incrocio del catalogo («soggetto per fase»). Ogni pannello porta il
  # numero dei suoi campioni; accanto composizione/griglia_<righe>_<colonne>.tsv.
  # facet_grid: null   # {rows: <nome>, cols: <nome>} oppure "<incrocio>"

beta:
  # [OBBLIGATORIO] Distanze da calcolare, fra: bray, jaccard, aitchison,
  # unifrac_weighted, unifrac_unweighted. Le due UniFrac richiedono un albero
  # nell'oggetto.
  # distances:

  # [CONDIZIONALE: unifrac_weighted, unifrac_unweighted] Radice dell'albero, da
  # cui UniFrac dipende: midpoint radica l'albero al punto medio del cammino
  # piu' lungo fra due foglie (phangorn::midpoint), sulla copia dell'oggetto;
  # existing usa la radice che l'albero ha gia', e respinge un albero che non
  # l'ha. L'albero che la pipeline aggiunge all'oggetto con phylo.enabled e'
  # gia' radicato al punto medio: per quello vale existing.
  # unifrac_root:

  # [CONDIZIONALE: aitchison] Pseudoconteggio sommato ai conteggi prima del CLR.
  # clr_pseudocount:

ord:
  # [OBBLIGATORIO] Metodi di ordinazione, fra: pcoa, nmds, tsne. Un elenco vuoto
  # non produce ordinazioni (e allora anche distances e' vuoto). Il t-SNE
  # (Rtsne) conserva i vicini, non le distanze: e' una figura descrittiva, i
  # test restano la PERMANOVA (van der Maaten e Hinton 2008).
  # methods:

  # [OBBLIGATORIO] Distanze da ordinare, fra quelle di beta.distances.
  # distances:

  # [CONDIZIONALE: pcoa] Correzione degli autovalori negativi, che le distanze
  # non euclidee producono: none, cailliez oppure lingoes (ape::pcoa).
  # pcoa_correction:

  # [CONDIZIONALE: nmds] Numero di avvii casuali della NMDS (vegan::metaMDS).
  # nmds_trymax:

  # [CONDIZIONALE: tsne] Perplessita' del t-SNE (Rtsne::Rtsne), circa il numero
  # di vicini efficaci di ogni campione; senza predefinito. Va da 5 a 50 nella
  # pratica; Rtsne richiede 3 * perplessita' <= campioni - 1, contando i
  # campioni dopo design.subset e il filtro (eco validate lo controlla, e
  # respinge un valore troppo alto con E-ECO-42).
  # tsne_perplexity:

  # [CONDIZIONALE: tsne] [STANDARD 1000] Iterazioni del t-SNE (Rtsne::Rtsne).
  # tsne_max_iter: 1000

  # [CONDIZIONALE: tsne] [STANDARD 0.5] Theta di Barnes-Hut (Rtsne::Rtsne): 0
  # calcola il t-SNE esatto, piu' lento.
  # tsne_theta: 0.5

  # [FACOLTATIVO] Colonne o gruppi derivati per cui disegnare le ordinazioni
  # colorate senza alcun test (figure descrittive: il titolo dice
  # «descrittivo, nessun test»), per esempio un raggruppamento visto dopo aver
  # guardato i dati. Non ripete le variabili del disegno.
  # color_by: []

stat:
  # [OBBLIGATORIO] Numero minimo di campioni perche' un gruppo entri nei test.
  # min_group_size:

  # [OBBLIGATORIO] Livello di significativita' sotto il quale le dispersioni
  # dei gruppi si dichiarano diverse, con un avviso sulla PERMANOVA.
  # significance_level:

  # [STANDARD] Permutazioni di PERMANOVA e test delle dispersioni
  # (vegan::adonis2, permutations = 999).
  permanova_permutations: 999

  # [FACOLTATIVO] Colonna degli strati entro cui permutare nella PERMANOVA e
  # nel test delle dispersioni.
  # permanova_strata: null

constrained:
  # [FACOLTATIVO] Ordinazione vincolata (supervisionata); nullo vuol dire
  # nessuna. rda: RDA (vegan::rda) sui conteggi trasformati; dbrda: RDA basata
  # sulle distanze (vegan::dbrda, Legendre e Anderson 1999) sulle distanze
  # dichiarate. A differenza della PCoA, gli assi sono quelli della sola
  # variabilita' che le variabili spiegano; la PERMANOVA resta il test fra
  # gruppi. Il test e' vegan::anova.cca per il modello e per i termini (by =
  # "margin"), con stat.permanova_permutations permutazioni, gli strati di
  # stat.permanova_strata e il seme. Uscite in vincolata/. Una dichiarazione
  # non coerente con il disegno e' respinta con E-ECO-43; un termine con un
  # solo valore fra i campioni del modello esce, e un modello che non si stima
  # non e' eseguito, con l'avviso E-ECO-45.
  # method: null

  # [CONDIZIONALE: method] Variabili esplicative: categoriche, gruppi derivati o
  # continue del disegno. I campioni senza valore in una variabile del modello
  # escono, con il motivo in campioni.tsv.
  # variables: []

  # [FACOLTATIVO] Variabili il cui effetto si toglie prima (Condition()), per
  # esempio quelle tecniche. Solo con method.
  # conditions: []

  # [CONDIZIONALE: rda] hellinger (Legendre e Gallagher 2001) o clr (con
  # beta.clr_pseudocount, che diventa allora obbligatorio).
  # transform:

  # [CONDIZIONALE: dbrda] Distanze, fra quelle di beta.distances (UniFrac
  # comprese): un modello per distanza.
  # distances: []

  # [CONDIZIONALE: method] Frazione dei campioni oltre la quale i gradi di
  # liberta' del modello danno l'avviso E-ECO-44, senza predefinito. Con molti
  # livelli (un luogo per campione o quasi) il modello si avvicina a quello
  # saturo e spiega molto per costruzione; una frazione bassa (per esempio un
  # decimo) avvisa presto, una alta tardi.
  # max_df_fraction:

plot:
  # [STANDARD] Palette dei gruppi in tutti i grafici (predefinito "Dark 3"
  # della funzione grDevices::hcl.colors). Ammette un nome di grDevices::hcl.pals(), "Okabe-Ito"
  # (grDevices::palette.colors, adatta ai daltonici), un nome di RColorBrewer
  # (per i nomi che ha anche hcl.pals vale RColorBrewer) o di viridisLite, oppure
  # un elenco di colori esadecimali ["#RRGGBB", ...]; un nome sconosciuto o un
  # colore non esadecimale e' respinto con E-ECO-41. Con piu' gruppi che
  # colori la palette si estende per interpolazione (grDevices::colorRampPalette),
  # con l'avviso E-ECO-46: i colori aggiunti non sono garantiti per chi non
  # distingue i colori. Le palette HCL e viridisLite non si estendono.
  palette: "Dark 3"
