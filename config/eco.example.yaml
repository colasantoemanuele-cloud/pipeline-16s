# Modello di configurazione delle analisi ecologiche di base.
#
# Le analisi lavorano a valle della pipeline, sull'oggetto finale che essa
# consegna (ps_final.rds), e non lo modificano. Questo file e' un modello: non
# contiene valori. Copialo, togli il commento a ogni parametro [OBBLIGATORIO] e
# dagli il valore del tuo studio. Le configurazioni complete dei dataset
# distribuiti con il repository stanno accanto ai loro dati, sotto dati/.
#
# Marcatori:
#   [OBBLIGATORIO]   nessun valore predefinito: senza, l'analisi non parte
#   [CONDIZIONALE]   obbligatorio se il metodo indicato e' richiesto, respinto
#                    altrimenti
#   [FACOLTATIVO]    il predefinito e' l'assenza
#   [STANDARD]       il predefinito e' quello del pacchetto R che realizza il
#                    metodo, indicato accanto
#
# Le chiavi sconosciute sono respinte. I nomi di colonna sono quelli della
# tabella dei campioni dell'oggetto; i valori si confrontano come testo.

design:
  # [OBBLIGATORIO] La variabile biologica: una colonna della tabella dei
  # campioni, trattata come categorica.
  # variable:

  # [FACOLTATIVO] Altre variabili biologiche, analizzate una alla volta.
  # other_variables: []

  # [FACOLTATIVO] Variabili tecniche (per esempio il lotto di estrazione),
  # nell'ordine in cui entrano nei modelli.
  # technical_variables: []

  # [FACOLTATIVO] Sottoinsieme dei campioni: per ogni colonna i valori ammessi
  # (fra virgolette). Si applica prima di tutto il resto.
  # subset: {}

run:
  # [OBBLIGATORIO] Seme della rarefazione e di ogni altra operazione casuale.
  # seed:

alpha:
  # [STANDARD] Profondita' di rarefazione. Nullo: la minima fra i campioni
  # analizzati (phyloseq::rarefy_even_depth, sample.size =
  # min(sample_sums(physeq))). Se dichiarata, i campioni con meno letture
  # escono dall'alfa diversita'. La rarefazione e' senza reinserimento.
  rarefy_depth: null

comp:
  # [OBBLIGATORIO] Rango tassonomico a cui agglomerare, fra quelli dell'oggetto.
  # rank:

  # [OBBLIGATORIO] Numero di taxa mostrati nei grafici; i rimanenti in «altri».
  # top_n:

beta:
  # [OBBLIGATORIO] Distanze da calcolare, fra: bray, jaccard, aitchison,
  # unifrac_weighted, unifrac_unweighted. Le due UniFrac richiedono un albero
  # nell'oggetto.
  # distances:

  # [CONDIZIONALE: unifrac_weighted, unifrac_unweighted] Radice dell'albero, da
  # cui UniFrac dipende: midpoint radica l'albero al punto medio del cammino
  # piu' lungo fra due foglie (phangorn::midpoint), sulla copia dell'oggetto;
  # existing usa la radice che l'albero ha gia', e respinge un albero che non
  # l'ha. L'albero che la pipeline aggiunge all'oggetto con phylo.enabled e'
  # gia' radicato al punto medio: per quello vale existing.
  # unifrac_root:

  # [CONDIZIONALE: aitchison] Pseudoconteggio sommato ai conteggi prima del CLR.
  # clr_pseudocount:

ord:
  # [OBBLIGATORIO] Metodi di ordinazione, fra: pcoa, nmds. Un elenco vuoto non
  # produce ordinazioni (e allora anche distances e' vuoto).
  # methods:

  # [OBBLIGATORIO] Distanze da ordinare, fra quelle di beta.distances.
  # distances:

  # [CONDIZIONALE: pcoa] Correzione degli autovalori negativi, che le distanze
  # non euclidee producono: none, cailliez oppure lingoes (ape::pcoa).
  # pcoa_correction:

  # [CONDIZIONALE: nmds] Numero di avvii casuali della NMDS (vegan::metaMDS).
  # nmds_trymax:

stat:
  # [OBBLIGATORIO] Numero minimo di campioni perche' un gruppo entri nei test.
  # min_group_size:

  # [OBBLIGATORIO] Livello di significativita' sotto il quale le dispersioni
  # dei gruppi si dichiarano diverse, con un avviso sulla PERMANOVA.
  # significance_level:

  # [STANDARD] Permutazioni di PERMANOVA e test delle dispersioni
  # (vegan::adonis2, permutations = 999).
  permanova_permutations: 999

  # [FACOLTATIVO] Colonna degli strati entro cui permutare nella PERMANOVA e
  # nel test delle dispersioni.
  # permanova_strata: null
