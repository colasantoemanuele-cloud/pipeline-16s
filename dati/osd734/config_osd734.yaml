# Configurazione per OSD-734 con i dati recuperati in dati/osd734/.
#
# I percorsi sono relativi alla radice del repository: la pipeline va lanciata
# da li', nel container con il repository montato (comando completo nel README
# della cartella). La riga di comando li rende assoluti al caricamento. I file
# da scaricare si ottengono con gli script della cartella:
#   letture       dati/osd734/fastq/        scarica_letture.py
#   riferimento   dati/osd734/riferimento/  scarica_riferimento.py
#   lotto         dati/osd734/lotto/        ricostruisci_lotto.py
# I parametri non indicati hanno il valore predefinito, che per OSD-734 e'
# quello giusto: i valori scelti su fatti accertati di questo dataset sono
# marcati [OSD-734] in config/config.example.yaml.
io:
  fastq_dir: dati/osd734/fastq
  assay_table: "dati/osd734/metadati/a_OSD-734_amplicon-sequencing_16s_Illumina MiSeq.txt"
  study_table: dati/osd734/metadati/s_OSD-734.txt
  out_root: output/osd734
  batch_table: dati/osd734/lotto/plate_well_map_960.tsv
tax:
  ref_fasta: dati/osd734/riferimento/silva_nr99_v138_train_set.fa.gz
  ref_md5: "56821dd6f365f64c8518a21e049c3232"
  ref_name: SILVA
  ref_version: "138"
  ref_bad_taxa: dati/osd734/riferimento/silva_138_v2_bad-taxa.csv
run:
  # Primo valore da adattare: run.threads non e' impostato e vale 16. Su una
  # macchina con meno processori utilizzabili i controlli di avvio fermano
  # l'esecuzione (E-S0-14): indicare il numero di processori (nproc) o meno.
  # Non cambia i risultati. Per esempio, su 12 processori:
  # threads: 12
  #
  # L'immagine con cui si esegue, ancorata per digest: quella pubblicata nel
  # registro, che si scarica con docker pull e questo stesso riferimento. Il
  # valore e' registrato nella configurazione salvata e nella provenienza di
  # ogni fase; non sceglie l'immagine da eseguire, che e' quella passata a
  # docker run. Chi costruisce l'immagine dal Dockerfile, invece di scaricarla,
  # indica qui il suo identificativo locale:
  #   echo "amplicon16s@$(docker image inspect <immagine> --format '{{.Id}}')"
  container: "ghcr.io/colasantoemanuele-cloud/amplicon16s@sha256:930dda008581b24cc3a3fea718c0fed3690b011958bf1716c643f92056970154"
