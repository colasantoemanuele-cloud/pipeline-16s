# Analisi ecologiche di base su OSD-734: configurazione di esempio.
#
# Oggetto di partenza: 12_final/ps_final.rds dell'esecuzione della pipeline con
# config_osd734.yaml. Il significato di ogni parametro e' in
# config/eco.example.yaml.

design:
  # Il modulo della stazione da cui viene il tampone: la variabile che lo
  # studio confronta.
  variable: modulo
  other_variables: []
  # Corsa di sequenziamento (due) e piastra di estrazione (dieci). Ogni
  # piastra sta in una sola corsa: i termini entrano nel modello in sequenza,
  # e con la piastra per prima alla corsa non resterebbe alcun grado di
  # liberta'. Prima il fattore piu' grossolano, poi quello annidato.
  technical_variables: [corsa, piastra]
  subset: {}

run:
  seed: 100

alpha:
  rarefy_depth: null

comp:
  # Il rango piu' fine assegnato dalla pipeline (letture di 137 basi).
  rank: Genus
  top_n: 10

beta:
  distances: [bray, jaccard, aitchison]
  clr_pseudocount: 1.0

ord:
  methods: [pcoa, nmds]
  distances: [bray, jaccard, aitchison]
  # Bray-Curtis e Jaccard non sono euclidee: autovalori negativi corretti.
  pcoa_correction: cailliez
  # Il predefinito di vegan::metaMDS: con 200 avvii non converge comunque (stress piu' basso di meno di 0,001).
  nmds_trymax: 20

stat:
  min_group_size: 5
  significance_level: 0.05
  permanova_permutations: 999
  permanova_strata: null
