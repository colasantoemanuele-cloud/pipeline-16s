# Analisi ecologiche di base sull'oggetto finale di OSD-170.
#
# La variabile dello studio e' l'altitudine del prelievo (a terra o in
# atmosfera): e' il fattore con cui lo studio chiede come cambiano i batteri
# dell'aria con la quota. L'oggetto non ha un albero: nessuna distanza UniFrac.
# Il significato di ogni parametro e' in config/eco.example.yaml.
design:
  variable: factor_value_altitude
  other_variables: []
  technical_variables: []
  subset: {}
run:
  seed: 100
alpha:
  rarefy_depth: null
comp:
  rank: Genus
  top_n: 10
beta:
  distances: [bray, jaccard, aitchison]
  clr_pseudocount: 1.0
ord:
  methods: [pcoa, nmds]
  distances: [bray, jaccard, aitchison]
  pcoa_correction: none
  nmds_trymax: 20
stat:
  min_group_size: 5
  significance_level: 0.05
  permanova_permutations: 999
  permanova_strata: null
