name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Immagine del runner ancorata a una versione esplicita e non a
    # ubuntu-latest: una build riproducibile non puo' poggiare sull'ultima
    # versione disponibile, qualunque essa sia.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # R serve ai test del ponte verso R, che lanciano script doppioni veri:
      # saltarli lascerebbe senza verifica il componente da cui dipendono
      # tutte le fasi di calcolo. L'immagine completa del container pesa
      # diversi gigabyte, mentre i doppioni chiedono solo R e jsonlite: qui si
      # installano quei due, alle stesse versioni del container (renv.lock).
      # L'azione e' ancorata al commit, non al tag, che puo' essere spostato.
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: "4.5.2"
          use-public-rspm: false

      # Lo snapshot datato del repository P3M fissa l'insieme dei pacchetti
      # disponibili; la verifica esplicita della versione fa fallire il passo
      # se lo snapshot non servisse quella attesa.
      - name: Install R packages for the bridge tests
        env:
          JSONLITE_VERSION: "2.0.0"
          P3M_SNAPSHOT: https://packagemanager.posit.co/cran/__linux__/noble/2025-09-01
        run: |
          Rscript --vanilla -e '
            lib <- Sys.getenv("R_LIBS_USER")
            if (!nzchar(lib)) stop("R_LIBS_USER non impostata")
            dir.create(lib, recursive = TRUE, showWarnings = FALSE)
            install.packages("jsonlite", repos = Sys.getenv("P3M_SNAPSHOT"), lib = lib)
            trovata <- as.character(packageVersion("jsonlite", lib.loc = lib))
            if (trovata != Sys.getenv("JSONLITE_VERSION")) {
              stop("jsonlite ", trovata, ", attesa ", Sys.getenv("JSONLITE_VERSION"))
            }
            cat("R", as.character(getRversion()), "- jsonlite", trovata, "\n")
          '

      # pip fissato come le altre dipendenze: l'ultima versione cambierebbe
      # nel tempo il modo in cui le dipendenze vengono risolte.
      - name: Install package
        run: |
          python -m pip install pip==25.2
          pip install -e ".[dev]"

      # Con questa variabile i test che richiedono R falliscono invece di
      # saltarsi se R manca: un ambiente che lo ha perso non passa per verde.
      # La suite gira su quattro processi (pytest-xdist, addopts in pyproject.toml);
      # i test sui dati reali, che qui si saltano, formano un gruppo che gira su
      # un solo processo (--dist loadgroup, gruppo dati_reali in tests/conftest.py).
      - name: Run test suite
        env:
          AMPLICON16S_RICHIEDI_R: "1"
        run: pytest

  container:
    name: Test nell'immagine della pipeline (parte ${{ matrix.parte }})
    # Le fasi di calcolo usano Bioconductor, e i loro test devono girare con le
    # stesse versioni del container, che e' il riferimento. Il modo che le
    # garantisce per costruzione e' costruire l'immagine dallo stesso
    # Dockerfile: le versioni R vengono verificate contro renv.lock durante la
    # build, e non esiste una seconda via d'installazione da tenere allineata.
    # Costa alcuni minuti per push e lo spazio dell'immagine sul runner.
    #
    # La suite e' divisa in due parti che girano insieme, ciascuna sul suo
    # runner: la durata e' la somma dei test divisa per i quattro processori, e
    # su un runner solo e' il doppio. La parte «calcolo» esegue i moduli elencati
    # in MODULI_DI_CALCOLO, la parte «resto» tutti gli altri (gli stessi moduli
    # passati a --ignore): l'elenco e' uno solo, e un modulo nuovo cade nel
    # «resto» senza toccare nulla, quindi nessun test resta fuori.
    runs-on: ubuntu-24.04
    # Un test bloccato fermerebbe il job fino al limite di GitHub (sei ore): le
    # due parti durano meno di meta' di questo tempo.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        parte: [calcolo, resto]
    env:
      MODULI_DI_CALCOLO: >-
        tests/test_w28_calcolo.py
        tests/test_catena_appaiata.py
        tests/test_taglio_primer.py
        tests/test_soglie.py
        tests/test_eco_configurazione.py
        tests/test_controlli_assenti.py
        tests/test_w15_consolidamento.py
        tests/test_w29_soglia.py
        tests/test_w14_s04_s07_denoising.py
        tests/test_w21_finale.py
        tests/test_w09_w10_retry_policy.py
        tests/test_w18_oggetto.py
        tests/test_w08_w09_graph_resume.py
        tests/test_init.py

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -f container/Dockerfile -t amplicon16s:ci .

      # Dentro l'immagine R e Bioconductor sono richiesti: se mancassero, i
      # test che li usano fallirebbero invece di saltarsi. Quattro processi
      # (pytest-xdist), come i processori del runner; i test sui dati reali, che
      # qui si saltano, girerebbero tutti su uno solo (gruppo dati_reali).
      - name: Run test suite in the image
        run: |
          if [ "${{ matrix.parte }}" = "calcolo" ]; then
            SELEZIONE="$MODULI_DI_CALCOLO"
          else
            SELEZIONE="$(printf -- '--ignore=%s ' $MODULI_DI_CALCOLO)"
          fi
          docker run --rm \
            -e AMPLICON16S_RICHIEDI_R=1 \
            -e AMPLICON16S_RICHIEDI_BIOC=1 \
            amplicon16s:ci \
            pytest -p no:cacheprovider $SELEZIONE
